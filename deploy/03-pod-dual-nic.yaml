# 拥有两张网卡、两个 IP 的 Pod
#
#   eth0 : 10.244.x.x   Calico 分配，overlay，承载集群内通信
#   net1 : 192.168.100.10  SR-IOV VF 直通，whereabouts 分配，underlay
#
# ★★ 三处名字必须完全一致 ★★
#   1) 本文件 resources.limits  →  intel.com/intel_sriov_netdevice
#   2) NAD 注解 resourceName    →  intel.com/intel_sriov_netdevice
#   3) Device Plugin ConfigMap  →  resourcePrefix=intel.com + resourceName=intel_sriov_netdevice
apiVersion: v1
kind: Pod
metadata:
  name: test-sriov
  namespace: default
  annotations:
    # 完整格式：JSON 数组，可指定接口名与 IP
    k8s.v1.cni.cncf.io/networks: |
      [{"name":"sriov-vlan1000","namespace":"default","interface":"net1"}]

    # 简写格式（二选一即可）：
    # k8s.v1.cni.cncf.io/networks: default/sriov-vlan1000
spec:
  containers:
  - name: app
    image: alpine:3.19
    command: ["sleep", "infinity"]
    resources:
      requests:
        intel.com/intel_sriov_netdevice: 1
      limits:
        intel.com/intel_sriov_netdevice: 1
---
# 变体：固定 IP（用 static IPAM）
apiVersion: v1
kind: Pod
metadata:
  name: test-sriov-static
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [{"name":"sriov-static","namespace":"default","interface":"net1"}]
spec:
  containers:
  - name: app
    image: alpine:3.19
    command: ["sleep", "infinity"]
    resources:
      requests:
        intel.com/intel_sriov_netdevice: 1
      limits:
        intel.com/intel_sriov_netdevice: 1
