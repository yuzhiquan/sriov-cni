# A Pod with two NICs and two IPs
#
#   eth0 : 10.244.x.x   assigned by Calico, overlay, carries in-cluster traffic
#   net1 : 192.168.100.10  SR-IOV VF passthrough, assigned by whereabouts, underlay
#
# ** The three names must match exactly **
#   1) This file: resources.limits  ->  intel.com/intel_sriov_netdevice
#   2) NAD annotation resourceName  ->  intel.com/intel_sriov_netdevice
#   3) Device Plugin ConfigMap  →  resourcePrefix=intel.com + resourceName=intel_sriov_netdevice
apiVersion: v1
kind: Pod
metadata:
  name: test-sriov
  namespace: default
  annotations:
    # Full format: JSON array, can specify interface name and IP
    k8s.v1.cni.cncf.io/networks: |
      [{"name":"sriov-vlan1000","namespace":"default","interface":"net1"}]

    # Short format (use either one):
    # k8s.v1.cni.cncf.io/networks: default/sriov-vlan1000
spec:
  containers:
  - name: app
    image: alpine:3.19
    command: ["sleep", "infinity"]
    resources:
      requests:
        intel.com/intel_sriov_netdevice: 1
      limits:
        intel.com/intel_sriov_netdevice: 1
---
# Variant: static IP (using static IPAM)
apiVersion: v1
kind: Pod
metadata:
  name: test-sriov-static
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/networks: |
      [{"name":"sriov-static","namespace":"default","interface":"net1"}]
spec:
  containers:
  - name: app
    image: alpine:3.19
    command: ["sleep", "infinity"]
    resources:
      requests:
        intel.com/intel_sriov_netdevice: 1
      limits:
        intel.com/intel_sriov_netdevice: 1
