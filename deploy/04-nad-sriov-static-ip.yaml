# Network definition with a fixed IP (pairs with the second Pod in 03-pod-dual-nic.yaml)
#
# static IPAM suits: NFV elements, databases, workloads that require a fixed address
# Drawback: you must guarantee no IP conflicts yourself; no cluster awareness
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-static
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/intel_sriov_netdevice
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": 1000,
      "mac": "02:11:22:33:44:66",
      "spoofchk": "off",
      "trust": "on",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "192.168.100.50/24",
            "gateway": "192.168.100.1"
          }
        ],
        "routes": [
          { "dst": "0.0.0.0/0" }
        ],
        "dns": {
          "nameservers": ["223.5.5.5"]
        }
      }
    }
