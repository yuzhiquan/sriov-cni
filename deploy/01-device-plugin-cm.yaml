# SR-IOV Network Device Plugin 资源配置
#
# 资源全名 = <resourcePrefix>/<resourceName>
#   ↓
#   intel.com/intel_sriov_netdevice   （netdevice 模式，VF 绑内核驱动）
#   intel.com/intel_sriov_dpdk        （vfio 模式，VF 绑 vfio-pci）
#
# 部署：
#   kubectl apply -f 01-device-plugin-cm.yaml
#   kubectl apply -f https://raw.githubusercontent.com/k8snetworkplumbingwg/sriov-network-device-plugin/master/deployments/k8s-v1.16/sriovdp-daemonset.yaml
apiVersion: v1
kind: ConfigMap
metadata:
  name: sriovdp-config
  namespace: kube-system
data:
  config.json: |
    {
      "resourceList": [
        {
          "resourcePrefix": "intel.com",
          "resourceName": "intel_sriov_netdevice",
          "deviceType": "netdevice",
          "selectors": {
            "vendors": ["8086"],
            "devices": ["1889"],
            "drivers": ["iavf"],
            "pfNames": ["ens1f0"]
          }
        },
        {
          "resourcePrefix": "intel.com",
          "resourceName": "intel_sriov_dpdk",
          "deviceType": "vfio",
          "selectors": {
            "vendors": ["8086"],
            "devices": ["1889"],
            "drivers": ["vfio-pci"],
            "pfNames": ["ens1f1"]
          }
        }
      ]
    }
---
# 常用厂商 / 设备 ID 速查
#
#   Intel 8086:1889  iavf        (E810 / 700 系列 VF)
#   Intel 8086:154c  ixgbevf     (X710/XL710 VF)
#   Intel 8086:1889  ice vf
#   Mellanox 15b3:1017 ConnectX-5/6 VF
#   Broadcom 14e4:16dc BCM575xx VF
#
# 查看本机：
#   lspci -nn | grep -i "virtual function"
#   lspci -nn | grep -i ethernet
