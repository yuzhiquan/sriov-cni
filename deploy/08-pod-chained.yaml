# Dual-NIC Pod in chained mode: only one annotation needed, no Multus / NAD.
#
#   eth0 : assigned by the primary CNI (calico)
#   net1 : created by the sriov chained plugin, which looks up the annotation value "vlan1000" in the conflist networks
#
# Variant A (vfAllocator=podresources): resources.limits must be declared so the scheduler and Device Plugin allocate a VF.
# Variant B (vfAllocator=pool): no resources needed; the CNI allocates a VF from the node-local pool.
apiVersion: v1
kind: Pod
metadata:
  name: test-chained-podresources
  namespace: default
  labels:
    app: test-chained
    version: v1
    component: demo
  annotations:
    sriov.example.com/network: vlan1000
spec:
  containers:
  - name: app
    image: alpine:3.19
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
        intel.com/intel_sriov_netdevice: 1
      limits:
        cpu: 200m
        memory: 128Mi
        intel.com/intel_sriov_netdevice: 1
    volumeMounts:
    - name: share
      mountPath: /shared
  volumes:
  - name: share
    emptyDir: {}
---
apiVersion: v1
kind: Pod
metadata:
  name: test-chained-pool
  namespace: default
  labels:
    app: test-chained
    version: v1
    component: demo
  annotations:
    sriov.example.com/network: vlan1000
spec:
  containers:
  - name: app
    image: alpine:3.19
    command: ["sleep", "infinity"]
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi
    volumeMounts:
    - name: share
      mountPath: /shared
  volumes:
  - name: share
    emptyDir: {}
