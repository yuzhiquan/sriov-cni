# In chained mode, the CNI process on each node needs to read Pod annotations.
# Create a ServiceAccount with only pods/get permission, then issue a token and write it to every node:
#
#   kubectl apply -f 07-chained-rbac.yaml
#   kubectl -n kube-system create token sriov-cni --duration=8760h > /etc/cni/net.d/sriov.d/token
#   kubectl -n kube-system get cm kube-root-ca.crt -o jsonpath='{.data.ca\.crt}' > /etc/cni/net.d/sriov.d/ca.crt
#   chmod 600 /etc/cni/net.d/sriov.d/token
#
# The token expires and must be rotated periodically (e.g. refresh it onto nodes via a CronJob/DaemonSet).
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sriov-cni
  namespace: kube-system
  labels:
    app: sriov-cni
    version: v0.1.0
    component: cni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sriov-cni-pod-reader
  labels:
    app: sriov-cni
    version: v0.1.0
    component: cni
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sriov-cni-pod-reader
  labels:
    app: sriov-cni
    version: v0.1.0
    component: cni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sriov-cni-pod-reader
subjects:
- kind: ServiceAccount
  name: sriov-cni
  namespace: kube-system
