# chained 模式下，节点上的 CNI 进程需要读 Pod 注解。
# 这里建一个只有 pods/get 权限的 ServiceAccount，再签发 token 写到每个节点：
#
#   kubectl apply -f 07-chained-rbac.yaml
#   kubectl -n kube-system create token sriov-cni --duration=8760h > /etc/cni/net.d/sriov.d/token
#   kubectl -n kube-system get cm kube-root-ca.crt -o jsonpath='{.data.ca\.crt}' > /etc/cni/net.d/sriov.d/ca.crt
#   chmod 600 /etc/cni/net.d/sriov.d/token
#
# token 有过期时间，需要定期轮转（可用 CronJob/DaemonSet 刷新到节点）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sriov-cni
  namespace: kube-system
  labels:
    app: sriov-cni
    version: v0.1.0
    component: cni
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: sriov-cni-pod-reader
  labels:
    app: sriov-cni
    version: v0.1.0
    component: cni
rules:
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: sriov-cni-pod-reader
  labels:
    app: sriov-cni
    version: v0.1.0
    component: cni
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: sriov-cni-pod-reader
subjects:
- kind: ServiceAccount
  name: sriov-cni
  namespace: kube-system
