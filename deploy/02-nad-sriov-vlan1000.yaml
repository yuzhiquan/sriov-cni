# NetworkAttachmentDefinition: defines the Pod's "second network"
#
# * Key annotation k8s.v1.cni.cncf.io/resourceName:
#   Multus uses it to query the kubelet PodResources API for the VF assigned to this Pod,
#   injects the PCI address into the config below as deviceID, then calls sriov-cni.
#
# Note: do not hardcode deviceID in config -- that is a test trick for pinning a single Pod,
#       Multus overrides it in production, and hardcoding may make two Pods fight over the same VF.
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-vlan1000
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/intel_sriov_netdevice
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": 1000,
      "spoofchk": "off",
      "trust": "on",
      "link_state": "enable",
      "mtu": 1500,
      "logLevel": "info",
      "logFile": "/var/log/sriov-cni.log",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.10",
        "range_end": "192.168.100.200",
        "gateway": "",
        "routes": [
          { "dst": "192.168.100.0/24" }
        ]
      }
    }
---
# Variant: policy routing, so traffic whose source address is 192.168.100.x goes out net1
#
#   Leave "gateway" empty -> no default route added to the main table (eth0 keeps its default route)
#   Routes with "table": 100 -> the plugin installs automatically:
#       ip rule add from <this Pod's net1 IP> table 100 pref 1100
#
# Effect:
#   Default egress      -> eth0 (cluster network, Service, DNS work normally)
#   bind(192.168.100.x) -> net1 (direct path to the physical network)
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-vlan1000-policy
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/intel_sriov_netdevice
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": 1000,
      "spoofchk": "off",
      "trust": "on",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.10",
        "range_end": "192.168.100.200",
        "gateway": "192.168.100.1",
        "routes": [
          { "dst": "192.168.100.0/24" },
          { "dst": "0.0.0.0/0", "gw": "192.168.100.1", "table": 100 }
        ]
      }
    }
