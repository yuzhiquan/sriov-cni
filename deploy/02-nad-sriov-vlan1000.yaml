# NetworkAttachmentDefinition：定义 Pod 的"第二张网络"
#
# ★ 关键注解 k8s.v1.cni.cncf.io/resourceName：
#   Multus 据此去 kubelet 的 PodResources API 查这个 Pod 分到了哪个 VF，
#   然后把 PCI 地址注入下面的 config 作为 deviceID，再调用 sriov-cni。
#
# 注意：config 里不要写死 deviceID —— 那是用来做单 Pod 固定分配的测试手段，
#       生产环境会被 Multus 覆盖，写死反而可能导致两个 Pod 抢同一块 VF。
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-vlan1000
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/intel_sriov_netdevice
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": 1000,
      "spoofchk": "off",
      "trust": "on",
      "link_state": "enable",
      "mtu": 1500,
      "logLevel": "info",
      "logFile": "/var/log/sriov-cni.log",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.10",
        "range_end": "192.168.100.200",
        "gateway": "",
        "routes": [
          { "dst": "192.168.100.0/24" }
        ]
      }
    }
---
# 变体：走策略路由，让"源地址是 192.168.100.x 的流量"走 net1
#
#   "gateway" 留空 → 不往 main 表加默认路由（eth0 的默认路由保留）
#   routes 带 "table": 100 → 插件自动下发
#       ip rule add from <本 Pod 的 net1 IP> table 100 pref 1100
#
# 效果：
#   默认出网        → eth0（集群网络、Service、DNS 正常）
#   bind(192.168.100.x) → net1（物理网络直通）
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-vlan1000-policy
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/intel_sriov_netdevice
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": 1000,
      "spoofchk": "off",
      "trust": "on",
      "ipam": {
        "type": "whereabouts",
        "range": "192.168.100.0/24",
        "range_start": "192.168.100.10",
        "range_end": "192.168.100.200",
        "gateway": "192.168.100.1",
        "routes": [
          { "dst": "192.168.100.0/24" },
          { "dst": "0.0.0.0/0", "gw": "192.168.100.1", "table": 100 }
        ]
      }
    }
