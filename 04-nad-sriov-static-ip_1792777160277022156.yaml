# 固定 IP 的网络定义（配合 03-pod-dual-nic.yaml 的第二个 Pod）
#
# static IPAM 适合：NFV 网元、数据库、必须固定地址的业务
# 缺点：IP 冲突要自己保证，没有集群感知
apiVersion: k8s.cni.cncf.io/v1
kind: NetworkAttachmentDefinition
metadata:
  name: sriov-static
  namespace: default
  annotations:
    k8s.v1.cni.cncf.io/resourceName: intel.com/intel_sriov_netdevice
spec:
  config: |
    {
      "cniVersion": "0.3.1",
      "type": "sriov",
      "vlan": 1000,
      "mac": "02:11:22:33:44:66",
      "spoofchk": "off",
      "trust": "on",
      "ipam": {
        "type": "static",
        "addresses": [
          {
            "address": "192.168.100.50/24",
            "gateway": "192.168.100.1"
          }
        ],
        "routes": [
          { "dst": "0.0.0.0/0" }
        ],
        "dns": {
          "nameservers": ["223.5.5.5"]
        }
      }
    }
